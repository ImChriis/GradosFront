  <div class="container">
    <div class="clientsList">

     <div class="body">
              <legend class="title">Contrato de Anillos</legend>
        
        
        <div class="table-wrapper" style="position: relative; min-height: 300px;">
          <app-loader [isLoading]="isLoading()" mode="component"></app-loader>

       <div class="table"> 
        @if(
      contracts$ | async
      ; as state) {
      <p-table
        #dt1
        [rows]="10"
        [value]="state"
        [paginator]="true"
        [globalFilterFields]="['TxLugar', 'Capacidad']"
        >
        <ng-template pTemplate="caption" let-event>
          <div class="flex-row">
            <div class="p-toolbar-group-end">
              <span class="p-input-icon-left ml-auto">
                <i class=""></i>
                <input
                class="search"
                #searchInput
                pInputText
                type="text"
                placeholder="BUSCAR"
                (input)="dt1.filterGlobal(searchInput.value, 'contains')"
              />
                </span>
            </div>
          </div>
          </ng-template>
          <ng-template pTemplate="header">
            <tr>
              <th style="min-width: 1rem" class="border">
                <div class="flex thstyles">NO. CONTRATO</div>
              </th>
              <th style="min-width: 1rem">
                <div class="flex thstyles">NO. CEDULA</div>
              </th>
              <th style="min-width: 18rem">
                <div class="flex thstyles">CLIENTE</div>
              </th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-contract class="p-table">
            <tr class="table-content"
                (click)="onSelectContract(contract)"
                [class.selected]="selectedContract === contract">
              <td>
                {{ contract.NoContrato }}
              </td>
              <td>
                {{ contract.nucedula }}
              </td>
              <td>
                {{ contract.txnombre }}
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="7">No elementos encontrados.</td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  </div>
     </div>
    </div>

    <div class="clientForm">
        <form [formGroup]="ringForm" autocomplete="off">
            <div class="inputGroup3">
                <div class="inputGroup">
                    <label for="noContrato">NO. CONTRATO</label>
                    <input type="text" id="noContrato" pInputText formControlName="NoContrato" />
                </div>

                <div class="inputGroup">
                    <label for="nucedula">NO. CEDULA</label>
                    <input type="text" id="nucedula" pInputText formControlName="nucedula" />
                </div>
            </div>

            <div class="inputGroup3">
                <div class="inputGroup2">
                    <label for="cliente">CLIENTE</label>
                    <input type="text" id="cliente" formControlName="txnombre" readonly />
                </div>

                <div class="searchIcon">
                    <button type="button" class="icon2 searchIcon" title="Buscar cliente" (click)="openSearchUserModal()">
                      <i class="pi pi-search add"></i>
                    </button>
                </div>
            </div>

            <div class="inputGroup3">
                <div class="inputGroup24">
                  <input type="radio" id="anillo" formControlName="MaTpCont" value="1"/>
                    <label for="anillo">ANILLO</label>
                </div>

                <div class="inputGroup24">
                  <input type="radio" id="reconocimiento" formControlName="MaTpCont" value="2"/>
                    <label for="reconocimiento">RECONOCIMIENTO</label>
                </div>

                <div class="inputGroup24">
                  <input type="radio" id="reparacion" formControlName="MaTpCont" value="3"/>
                    <label for="reparacion">REPARACIÓN</label>
                </div>

                <div class="inputGroup24">
                  <input type="radio" id="jostens" formControlName="MaTpCont" value="4"/>
                    <label for="jostens">JOSTENS</label>
                </div>

                <div class="inputGroup24">
                  <input type="radio" id="otros" formControlName="MaTpCont" value="5"/>
                    <label for="otros">OTROS</label>
                </div>
            </div>

            <div class="inputGroup3">
              <p-tabs [(value)]="activeTab">
                <p-tablist>
                    <p-tab [value]="0">REGALIAS</p-tab>
                    <p-tab [value]="1">DETALLES</p-tab>
                    <p-tab [value]="2">ESTADO</p-tab>
                    <p-tab [value]="3">SALDO</p-tab>
                  </p-tablist>
                  <p-tabpanels>
                    <p-tabpanel [value]="0">
                      <div class="detailsContent">
                        <fieldset>
                          <legend>Detalles de la institución</legend>
                        
                          <div class="institution">

                            <div class="bot">
                                <div class="inputs">
                                <label for="titulo">Titulo</label>
                                <input type="text" id="titulo" formControlName="titulo" readonly />
                                <button type="button"><i class="pi pi-search"></i></button>
                              </div>
                            </div>

                            <div class="top">
                              <div class="inputs">
                                <label for="especialidad">Espec.</label>
                                <input type="text" id="especialidad" formControlName="especialidad" readonly />
                              </div>

                              <div class="inputs">
                                <label for="siglas">Siglas</label>
                                <input type="text" id="siglas" formControlName="siglas" readonly />
                                <button type="button"><i class="pi pi-search"></i></button>
                              </div>
                            </div>
                          </div>
                        </fieldset>

                        <fieldset>
                          <legend>Detalles del Anillo</legend>

                          <div class="top">
                            <div class="left">
                              <div class="leftInput">
                                <label for="modelo">Modelo: </label>
                                <input type="text" id="modelo" formControlName="modelo" />
                              </div>

                              <div class="leftInput">
                                <label for="kilate">Kilate: </label>
                                <input type="text" id="kilate" formControlName="kilate" />
                              </div>

                              <div class="leftInput">
                                <label for="medida">Medida: </label>
                                <input type="text" id="medida" formControlName="medida" />
                              </div>

                              <div class="leftInput">
                                <label for="peso">Peso: </label>
                                <input type="text" id="peso" formControlName="peso" />

                                <label for="peso">Grs</label>
                              </div>
                            </div>

                            <div class="right">
                              <div class="rightInput">
                                <label for="zircone">Cantidad Zircone: </label>
                                <input type="text" id="zircone" formControlName="cazirc" />
                                <input type="radio" id="radio" formControlName="tpzirc" value="1.50" />
                                <label for="radio">1.50</label>
                              </div>

                              <div class="rightInput">
                                <input type="checkbox" id="acumulado" name="acumulado" />
                                <label for="acumulado">Acumulado </label>
                                <input type="radio" id="radio2" formControlName="tpzirc" value="1.25" />
                                <label for="radio2">1.25</label>
                              </div>

                              <div class="rightInput">
                                <input type="checkbox" id="activo" formControlName="InActivo" />
                                <label for="activo">Activo / Inactivo </label>
                                <input type="radio" id="radio3" formControlName="tpzirc" value="AMBOS" />
                                <label for="radio3">Ambos</label>
                              </div>

                              <div class="rightInput">      <!-- era el anidado dentro de la fila 3 -->
                                <input type="checkbox" id="anulado" formControlName="Anulado" />
                                <label for="anulado">Anulado </label>
                                <input type="checkbox" id="exonerado" formControlName="Exonerado" />
                                <label for="exonerado">Exonerado</label>
                              </div>
                            </div>
                          </div>

                          <div class="bot">
                            <div class="inputs">
                              <label for="observaciones">Observaciones: </label>
                              <input type="text" id="observaciones" formControlName="TxObservacion" />
                            </div>
                          </div>
                        </fieldset>
                      </div>
                    </p-tabpanel>
                    <p-tabpanel [value]="1">
                      <div class="detailsContent">
                        <fieldset>
                          <div class="regalias">
                            <div class="regaliasCol">
                              <div class="checkRow">
                                <input type="checkbox" id="medalla" formControlName="inmedalla" />
                                <label for="medalla">Medalla</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="cinta" formControlName="incinta" />
                                <label for="cinta">Cinta</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="botonInstitucion" formControlName="inbotoninst" />
                                <label for="botonInstitucion">Botón Institución</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="botonEspecialidad" formControlName="inbotesp" />
                                <label for="botonEspecialidad">Botón Especialidad</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="placa" formControlName="inplaca" />
                                <label for="placa">Placa</label>
                              </div>
                            </div>

                            <div class="regaliasCol">
                              <div class="checkRow">
                                <input type="checkbox" id="portaDiploma" formControlName="inportadip" />
                                <label for="portaDiploma">Porta Diploma</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="llavero" formControlName="inllavero" />
                                <label for="llavero">Llavero</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="portaNombre" formControlName="inportanombre" />
                                <label for="portaNombre">Porta Nombre</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="togaBirrete" formControlName="intoga" />
                                <label for="togaBirrete">Toga y Birrete</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="estuche" formControlName="inestuche" />
                                <label for="estuche">Estuche</label>
                              </div>
                            </div>

                            <div class="regaliasCol">
                              <div class="checkRow">
                                <input type="checkbox" id="albumSencillo" formControlName="inalbumsenc" />
                                <label for="albumSencillo">Album Sencillo</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="albumEspecial" formControlName="inalbumesp" />
                                <label for="albumEspecial">Album Especial</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="video" formControlName="invideo" />
                                <label for="video">Video</label>
                              </div>

                              <div class="checkRow">
                                <input type="checkbox" id="fotografia" formControlName="infotografia" />
                                <label for="fotografia">Fotografía</label>
                                <input type="text" class="qtyInput" formControlName="cafotografia" />
                              </div>
                            </div>
                          </div>

                          <div class="checkRow">
                            <input type="checkbox" id="diploma" formControlName="indiploma" />
                            <label for="diploma">Diploma</label>
                          </div>
                          <input type="text" class="regaliasInput" formControlName="TxDiploma" />

                          <div class="checkRow">
                            <input type="checkbox" id="otrosRegalias" formControlName="Inotroreg" />
                            <label for="otrosRegalias">Otros</label>
                          </div>
                          <input type="text" class="regaliasInput" formControlName="TxOtroReg" />
                        </fieldset>
                      </div>
                    </p-tabpanel>
                    <p-tabpanel [value]="2">
                      <div class="detailsContent">
                        <fieldset>
                          <div class="estadoHead">
                            <div class="estadoRow">
                              <label for="estadoContrato">Estado del Contrato:</label>
                              <select id="estadoContrato" formControlName="MaEstado">
                                <option value="1">1 - En Proceso</option>
                                <option value="2">2 - En Fabricación</option>
                                <option value="3">3 - Fabricado</option>
                                <option value="4">4 - En Engastes</option>
                                <option value="5">5 - Por Entregar</option>
                                <option value="6">6 - Entregado</option>
                                <option value="7">7 - Servicio</option>
                                <option value="8">8 - Reclamo</option>
                                <option value="9">9 - Anulado</option>
                              </select>
                            </div>

                            <div class="estadoRow">
                              <label for="requeridoEl">Requerido el:</label>
                              <input type="date" id="requeridoEl" formControlName="FeSolici" />
                            </div>
                          </div>

                          <div class="estadoGrid">
                            <fieldset>
                              <legend>Contrato</legend>

                              <div class="estadoField">
                                <label for="contratoInicio">Inicio:</label>
                                <input type="date" id="contratoInicio" formControlName="feinicio" />
                              </div>

                              <div class="estadoField">
                                <label for="contratoEntrega">Entrega:</label>
                                <input type="date" id="contratoEntrega" formControlName="FeFin" />
                              </div>
                            </fieldset>

                            <fieldset>
                              <legend>Fabricación</legend>

                              <div class="estadoField">
                                <label for="fabricacionInicio">Inicio:</label>
                                <input type="date" id="fabricacionInicio" formControlName="Feinifab" />
                              </div>

                              <div class="estadoField">
                                <label for="fabricacionFin">Fin:</label>
                                <input type="date" id="fabricacionFin" formControlName="FeFinFab" />
                              </div>

                              <div class="estadoField">
                                <label for="orden">Orden:</label>
                                <input type="text" id="orden" formControlName="nuordenfab" />
                              </div>
                            </fieldset>

                            <fieldset>
                              <legend>Engaste</legend>

                              <div class="estadoField">
                                <label for="engasteInicio">Inicio:</label>
                                <input type="date" id="engasteInicio" formControlName="FeIniEng" />
                              </div>

                              <div class="estadoField">
                                <label for="engasteFin">Fin:</label>
                                <input type="date" id="engasteFin" formControlName="FeFinEng" />
                              </div>
                            </fieldset>
                          </div>
                        </fieldset>
                      </div>
                    </p-tabpanel>
                    <p-tabpanel [value]="3">
                      <div class="detailsContent">
                        <fieldset>
                          <div class="saldo">
                            <div class="saldoRow">
                              <label for="montoContrato">Monto Contrato:</label>
                              <input type="text" id="montoContrato" formControlName="mncontrato" />
                            </div>

                            <div class="saldoRow">
                              <label for="descuento">Descuento:</label>
                              <input type="text" id="descuento" formControlName="mndescuento" />
                            </div>

                            <div class="saldoRow">
                              <label for="inicialContrato">Inicial Contrato:</label>
                              <input type="text" id="inicialContrato" formControlName="mninicial" />
                            </div>

                            <div class="saldoRow">
                              <label for="montoPagado">Monto Pagado:</label>
                              <input type="text" id="montoPagado" formControlName="mnpagado" readonly />
                            </div>

                            <div class="saldoRow">
                              <label for="montoSaldo">Monto Saldo:</label>
                              <input type="text" id="montoSaldo" formControlName="mnsaldo" readonly />
                            </div>
                          </div>

                          <div class="saldoActions">
                            <button type="button" class="payBtn" (click)="pay()" [disabled]="!selectedContract">
                              <span class="payIcon">💰</span>
                              Efectuar Pago
                            </button>
                          </div>
                        </fieldset>
                      </div>
                    </p-tabpanel>
                  </p-tabpanels>
              </p-tabs>
            </div>
        </form>

                <div class="buttons">
          <!-- <div class="icon" title="Buscar">
            <i class="pi pi-search searchIcon"></i>
          </div> -->

          <div class="icons">
            <div class="icon" title="Agregar" (click)="onAdd()" [class.disabled]="isAdding">
              <i class="pi pi-plus add"></i>
            </div>

            <div class="icon" title="Guardar" (click)="onSave()" [class.disabled]="!isEnabled">
              <i class="pi pi-save save"></i>
            </div>

            <div class="icon" title="Eliminar" (click)="onDelete()" [class.disabled]="!selectedContract">
              <i class="pi pi-trash delete"></i>
            </div>
          </div>
          
          <div class="icon cancel" title="Cancelar" (click)="onCancel()">
            <i class="pi pi-times cancel"></i>
          </div>
        </div>
    </div>
</div>
