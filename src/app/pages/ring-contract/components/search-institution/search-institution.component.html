<div class="searchInstitution">

  <div class="table-wrapper" style="position: relative; min-height: 300px;">
    <div class="table">
      @if (institutions$ | async; as state) {
        <p-table
          #dtSearch
          dataKey="CodigoInst"
          [value]="state"
          [rows]="10"
          [paginator]="true"
          [globalFilterFields]="['siglas', 'nbinstitucion', 'tpinstitucion']"
          styleClass="ml-3 mr-3"
        >
          <ng-template pTemplate="caption">
            <div class="flex-row">
              <div class="p-toolbar-group-end">
                <span class="p-input-icon-left ml-auto">
                  <input
                    class="search searchInput"
                    #searchInput
                    pInputText
                    type="text"
                    placeholder="BUSCAR"
                    (input)="dtSearch.filterGlobal(searchInput.value, 'contains')"
                  />
                </span>
              </div>
            </div>
          </ng-template>

          <ng-template pTemplate="header">
            <tr>
              <th style="min-width: 8rem" class="border">
                <div class="flex thstyles">SIGLAS</div>
              </th>
              <th style="min-width: 20rem">
                <div class="flex thstyles">INSTITUCIÓN</div>
              </th>
              <th style="min-width: 8rem">
                <div class="flex thstyles">TIPO</div>
              </th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-institution>
            <tr class="table-content"
                (click)="selectInstitution(institution)"
                [class.selected]="selectedInstitution?.CodigoInst === institution.CodigoInst">
              <td>{{ institution.siglas }}</td>
              <td>{{ institution.nbinstitucion }}</td>
              <td>{{ institution.tpinstitucion }}</td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4">No elementos encontrados.</td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  </div>

  <div class="modalButtons">
    <button type="button" class="btn accept"
            [disabled]="!selectedInstitution" (click)="accept()">
      ACEPTAR
    </button>
    <button type="button" class="btn cancel" (click)="cancel()">
      CANCELAR
    </button>
  </div>

</div>
