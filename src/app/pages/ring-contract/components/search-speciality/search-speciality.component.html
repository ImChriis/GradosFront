<div class="searchSpeciality">

  <div class="table-wrapper" style="position: relative; min-height: 300px;">
    <div class="table">
      @if (specialities$ | async; as state) {
        <p-table
          #dtSearch
          dataKey="CodigoEsp"
          [value]="state"
          [rows]="10"
          [paginator]="true"
          [globalFilterFields]="['Titulo', 'Especialidad']"
          styleClass="ml-3 mr-3"
        >
          <ng-template pTemplate="caption">
            <div class="flex-row">
              <div class="p-toolbar-group-end">
                <span class="p-input-icon-left ml-auto">
                  <input
                    class="search searchInput"
                    #searchInput
                    pInputText
                    type="text"
                    placeholder="BUSCAR"
                    (input)="dtSearch.filterGlobal(searchInput.value, 'contains')"
                  />
                </span>
              </div>
            </div>
          </ng-template>

          <ng-template pTemplate="header">
            <tr>
              <th style="min-width: 14rem" class="border">
                <div class="flex thstyles">TITULO</div>
              </th>
              <th style="min-width: 14rem">
                <div class="flex thstyles">ESPECIALIDAD</div>
              </th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-speciality>
            <tr class="table-content"
                (click)="selectSpeciality(speciality)"
                [class.selected]="selectedSpeciality?.CodigoEsp === speciality.CodigoEsp">
              <td>{{ speciality.Titulo }}</td>
              <td>{{ speciality.Especialidad }}</td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4">No elementos encontrados.</td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  </div>

  <div class="modalButtons">
    <button type="button" class="btn accept"
            [disabled]="!selectedSpeciality" (click)="accept()">
      ACEPTAR
    </button>
    <button type="button" class="btn cancel" (click)="cancel()">
      CANCELAR
    </button>
  </div>

</div>
