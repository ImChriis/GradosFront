<div class="container">
    <nav>
        <p-menubar [model]="items" />
<div class="icons">
    <button routerLink="/home" title="Inicio">
        <span class="emoji-icon">🏠</span>
    </button>

    <div class="separator"></div>

    <button routerLink="/clients" title="Clientes">
        <span class="emoji-icon">👤</span>
    </button>

    <button routerLink="/specialties" title="Especialidades">
        <span class="emoji-icon">💼</span>
    </button>

    <button routerLink="/institutions" title="Instituciones">
        <span class="emoji-icon">🏛️</span>
    </button>

    <button routerLink="/actPlaces" title="Lugares de Acto">
        <span class="emoji-icon">📍</span>
    </button>

    <button routerLink="/banks" title="Bancos">
        <span class="emoji-icon">🏦</span>
    </button>

    <button routerLink="/paymentMethods" title="Métodos de Pago">
        <span class="emoji-icon">💳</span>
    </button>

    <div class="separator"></div>

    <button routerLink="/ringContracts" title="Contratos de anillos">
        <span class="emoji-icon">💍</span>
    </button>

    <button routerLink="/actContracts" title="Contratos de Acto">
        <span class="emoji-icon">🎓</span>
    </button>

    <div class="separator"></div>

    <button routerLink="/users" title="Usuarios">
        <span class="emoji-icon">👥</span>
    </button>

    @if(this.role === 'Master') {
        <button routerLink="/audit" title="Auditoría">
            <span class="emoji-icon">📋</span>
        </button>
    }

    <button routerLink="/settings" title="Configuración">
        <span class="emoji-icon">⚙️</span>
    </button>

    <div class="separator"></div>

    <button (click)="logout()" title="Cerrar sesión">
        <span class="emoji-icon">🚪</span>
    </button>
</div>
    </nav>

    <div class="content">
        <router-outlet></router-outlet>
    </div>

    <footer>
        <!-- <div class="info">
            <label>Server</label>
            <p>Server is running...</p>
        </div> -->

        <div class="info">
            <label>Version</label>
            <p>2.1.2</p>
        </div>

        <div class="info">
            <label>Usuario</label>
            <p>{{ user }}</p>
        </div>

        <div class="info">
            <label>Nivel</label>
            <p>{{ role }}</p>
        </div>
    </footer>
</div>
