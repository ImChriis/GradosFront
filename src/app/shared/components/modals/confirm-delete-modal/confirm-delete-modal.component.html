<div class="container">
        <div class="message">
        <p>{{ message }}</p>
        </div>

    <div class="buttons">
        <button label="Cancelar" class="p-button-text cancel" (click)="cancel()">{{ data.cancelLabel || 'Cancelar' }}</button>
        <button label="Eliminar" class="p-button-danger confirm" (click)="confirm()">{{ data.confirmLabel || 'Eliminar' }}</button>
    </div>
</div>
