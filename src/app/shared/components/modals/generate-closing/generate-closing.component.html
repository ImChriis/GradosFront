<form [formGroup]="generateClosingForm">
    @if(isLoading()) {
        <app-loader [isLoading]="isLoading()"></app-loader>
    }

    <div class="container">
        <fieldset class="group">
            <legend class="title">Fecha y Hora del Cierre</legend>

            <div class="selects">
                <div class="inputGroup2">
                    <input type="text" id="fechaVista" name="fechaVista" formControlName="fechaVista" readonly>
                </div>
                <div class="inputGroup2">
                    <input type="text" id="hora" name="hora" formControlName="hora" readonly>
                </div>
            </div>
        </fieldset>

        <fieldset class="group">
            <legend class="title">No. Cierre {{ tipo }} a Generar</legend>

            <div class="selects">
                <div class="inputGroup2">
                    <input type="text" id="NoCierre" name="NoCierre" formControlName="NoCierre" appOnlyNumbers readonly>
                </div>
            </div>
        </fieldset>

        <fieldset class="group">
            <legend class="title">Destino</legend>

            <div class="selects">
                <div class="inputGroup">
                    <input type="radio" id="pantalla" name="reportOption" value="pantalla" checked #optPantalla>
                    <label for="pantalla">En pantalla</label>
                </div>

                <div class="inputGroup">
                    <input type="radio" id="pdf" name="reportOption" value="imprimir" #optImprimir>
                    <label for="pdf">Imprimir (Descargar)</label>
                </div>
            </div>
        </fieldset>

        <div class="btns">
            <button type="button" class="pdf" (click)="onSubmit('PDF', optPantalla.checked)">PDF</button>
            <button type="button" class="excel" (click)="onSubmit('EXCEL', optPantalla.checked)">EXCEL</button>
        </div>
    </div>
</form>
