<form [formGroup]="contractForm">
    @if(isLoading()) {
        <app-loader [isLoading]="isLoading()"></app-loader>
    }

    <div class="container">
        <fieldset class="group">
            <legend class="title">No. de Contrato</legend>

            <div class="selects">
                <div class="inputGroup2">
                    <input type="text" id="NoContrato" formControlName="NoContrato" appOnlyNumbers>
                </div>
            </div>

            <div class="selects tipo">
                <div class="inputGroup">
                    <input type="radio" id="tipoActo" formControlName="tipo" value="ACTO">
                    <label for="tipoActo">Acto de Grado</label>
                </div>

                <div class="inputGroup">
                    <input type="radio" id="tipoAnillo" formControlName="tipo" value="ANILLO">
                    <label for="tipoAnillo">Anillo</label>
                </div>
            </div>
        </fieldset>

        <fieldset class="group">
            <legend class="title">Destino</legend>

            <div class="selects">
                <div class="inputGroup">
                    <input type="radio" id="pantalla" name="reportOption" value="pantalla" checked #optPantalla>
                    <label for="pantalla">En pantalla</label>
                </div>

                <div class="inputGroup">
                    <input type="radio" id="imprimir" name="reportOption" value="imprimir">
                    <label for="imprimir">Imprimir (Descargar)</label>
                </div>
            </div>
        </fieldset>

        <div class="btns">
            <button type="button" class="pdf" (click)="onSubmit('PDF', optPantalla.checked)">PDF</button>
            <button type="button" class="excel" (click)="onSubmit('EXCEL', optPantalla.checked)">EXCEL</button>
        </div>
    </div>
</form>
